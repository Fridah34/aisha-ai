services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aisha_backend

    environment:
      # ==========================================
      # CLOUD DATABASE — NEON POSTGRESQL
      # ==========================================
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}

      # ==========================================
      # CLOUD CACHE — UPSTASH REDIS
      # ==========================================
      REDIS_URL: ${REDIS_URL}
      REDIS_TOKEN: ${REDIS_TOKEN}

      # ==========================================
      # AI PROVIDERS
      # ==========================================
      AI_PROVIDER: ${AI_PROVIDER:-groq}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

      # ==========================================
      # TWILIO / WHATSAPP
      # ==========================================
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}

      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}

      TWILIO_QUICK_REPLY_SID: ${TWILIO_QUICK_REPLY_SID}
      TWILIO_LIST_PICKER_SID: ${TWILIO_LIST_PICKER_SID}
      TWILIO_BROWSE_MORE_SID: ${TWILIO_BROWSE_MORE_SID}

      # ==========================================
      # GOOGLE OAUTH
      # ==========================================
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # ==========================================
      # APPLICATION CONFIGURATION
      # ==========================================
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL}

      KNOWLEDGE_BASE_MAX_UPLOAD_MB: ${KNOWLEDGE_BASE_MAX_UPLOAD_MB:-25}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # ==========================================
    # LOCAL DEVELOPMENT VOLUME
    # ==========================================
    volumes:
      - .:/app
      - /app/__pycache__
      - ./uploads:/app/uploads
      

    # ==========================================
    # BACKEND PORT
    # ==========================================
    ports:
      - "8000:8000"

    # ==========================================
    # AUTOMATIC RESTART
    # ==========================================
    restart: unless-stopped

    # ==========================================
    # DATABASE MIGRATIONS + FASTAPI
    # ==========================================
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
      
