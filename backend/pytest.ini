[pytest]
# Scope collection to the real automated suite. The repo also contains a
# handful of legacy root-level `test_*.py` files (test_ai.py, test_ai_db.py,
# test_db.py, test_language.py, test_redis.py) that are manual smoke scripts
# with top-level side effects (real DB/Redis/AI calls) — they predate this
# suite and are not meant to be pytest-collected.
testpaths = tests
asyncio_mode = strict
